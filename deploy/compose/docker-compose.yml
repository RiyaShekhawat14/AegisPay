services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aegispay_migration
      POSTGRES_PASSWORD: aegispay
      POSTGRES_DB: aegispay
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../api/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegispay_migration -d aegispay"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  db_migrate:
    image: postgres:16
    environment:
      PGPASSWORD: aegispay
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "db", "-U", "aegispay_migration", "-d", "aegispay", "-f", "/migrations/0001_initial.sql"]
    volumes: ["../../db/migrations:/migrations:ro"]
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  localstack:
    image: localstack/localstack:3.5.0
    environment:
      SERVICES: sqs
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports: ["4566:4566"]

  app:
    build:
      context: ../..
      dockerfile: api/Dockerfile
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://aegispay_app:aegispay@db:5432/aegispay
      REDIS_URL: redis://redis:6379/0
      SQS_URL: http://localstack:4566/000000000000/aegispay
    depends_on: ["db_migrate", "redis", "localstack"]
    ports: ["8000:8000"]

  ai_runtime:
    build:
      context: ../..
      dockerfile: api/Dockerfile.ai
    environment:
      CONTROL_PLANE_URL: http://app:8000
      CONTROL_PLANE_TOKEN: ""
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:0.5b
    depends_on: ["app"]
    ports: ["8001:8000"]

volumes:
  pgdata:
