name: Integration

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    continue-on-error: true  # needs a real service; verify once wired
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegispay_migration
          POSTGRES_PASSWORD: aegispay
          POSTGRES_DB: aegispay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready" --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python -m pip install -e "api[dev]"
      - name: Create application role (db/init.sql)
        env:
          PGPASSWORD: aegispay
        run: psql -h localhost -U aegispay_migration -d aegispay -f api/db/init.sql
      - name: Apply migrations
        env:
          PGPASSWORD: aegispay
        run: |
          psql -h localhost -U aegispay_migration -d aegispay -f db/migrations/0001_initial.sql
          psql -h localhost -U aegispay_migration -d aegispay -f db/migrations/0002_password_reset.sql
      - name: Integration + red-team tests
        working-directory: api
        env:
          DATABASE_URL: postgresql+asyncpg://aegispay_app:aegispay@localhost:5432/aegispay
        run: pytest -q tests/integration tests/redteam
