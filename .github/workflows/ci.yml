name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, no services — runs on every push/PR.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend deps + dev tools
        run: python -m pip install -e "backend[dev]"

      - name: Lint (ruff)
        run: ruff check backend/app backend/ai_runtime backend/tests

      - name: Format check (ruff)
        run: ruff format --check backend/app backend/ai_runtime backend/tests

      - name: Type check (mypy) on domain modules
        run: mypy --ignore-missing-imports \
          backend/app/modules/protocol_gateway backend/app/modules/idempotency \
          backend/app/modules/commerce backend/app/modules/campaigns backend/app/modules/refunds \
          backend/app/modules/payments/state.py backend/app/modules/policy backend/app/modules/audit \
          backend/app/modules/events backend/app/modules/passport backend/app/modules/outbox

      - name: Unit tests (payment safety, policy, gateway, idempotency, carts, budget, refunds)
        working-directory: backend
        run: pytest -q tests/unit

      - name: Compile backend
        run: find backend/app backend/ai_runtime backend/tests -name '*.py' -print0 | xargs -0 -n1 python -m py_compile

      - name: Validate OpenAPI YAML
        run: python -c "import glob,yaml; fs=glob.glob('api/*.yaml'); assert fs; [yaml.safe_load(open(f)) for f in fs]; print('OpenAPI OK:', fs)"

      - name: Docs present
        run: |
          test -f README.md
          test -f docs/00-architecture-master.md
          test -d docs/03-architecture-decision-records
          echo "Docs present"

      - name: Secret detection (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency scan (pip-audit)
        run: pip-audit --disable-pip -r <(python -c "import tomllib,pathlib; d=tomllib.loads(pathlib.Path('backend/pyproject.toml').read_text()); print('\n'.join(d['project']['dependencies']))")

  # Needs a real Postgres — runs the migration, then integration tests (Razorpay Test Mode configurable).
  integration:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aegispay_migration
          POSTGRES_PASSWORD: aegispay
          POSTGRES_DB: aegispay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready" --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e "backend[dev]"
      - name: Apply migrations
        env:
          PGPASSWORD: aegispay
        run: psql -h localhost -U aegispay_migration -d aegispay -f backend/migrations/0001_init.sql
      - name: Integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://aegispay_app:aegispay@localhost:5432/aegispay
        run: pytest -q tests/integration

  # Frontend build (Next.js). npm ci + build only; no deploy here.
  frontend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
