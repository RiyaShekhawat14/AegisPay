name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: python -m pip install --quiet pyyaml
      - name: Validate OpenAPI YAML
        run: python -c "import glob,yaml; fs=glob.glob('api/*.yaml'); assert fs,'no openapi file'; [yaml.safe_load(open(f)) for f in fs]; print('OpenAPI YAML OK:', fs)"
      - name: Validate docs + README present
        run: |
          test -f README.md
          test -f docs/00-architecture-master.md
          test -d docs/03-architecture-decision-records
          echo "Docs present"
      - name: Validate build scripts compile
        run: |
          for f in pdf/build_pdf.py pdf/build_langgraph.py pdf/build_v2.py pdf/build_v3.py pdf/build_v4.py pdf/build_db_easy.py; do python -m py_compile "$f" && echo "OK $f"; done
      - name: Compile backend + ai_runtime + tests
        run: |
          find backend/app backend/ai_runtime backend/tests -name '*.py' -print0 | xargs -0 -n1 python -m py_compile
          echo "backend compiles"
