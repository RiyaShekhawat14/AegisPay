name: Web CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    continue-on-error: true  # no lockfile committed yet; verify once generated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
