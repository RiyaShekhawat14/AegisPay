[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegispay"
version = "0.1.0"
description = "AegisPay — trust & growth layer for agentic commerce"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "redis>=5.0",
  "structlog>=24.1",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-instrumentation-fastapi",
  "langgraph>=0.2",
  "langchain-core",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio",
  "ruff",
  "mypy",
  "alembic",
]

[tool.setuptools.packages.find]
include = ["app*", "ai_runtime*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."
files = ["app/modules"]
check_untyped_defs = true
