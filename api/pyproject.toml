[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegispay"
version = "0.1.0"
description = "AegisPay — trust & growth layer for agentic commerce"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.142",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "bcrypt>=4.0",
  "redis>=5.0",
  "structlog>=24.1",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-instrumentation-fastapi",
  "langgraph>=0.2",
  "langchain-core",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio",
  "ruff==0.16.6",
  "mypy",
  "alembic",
]

[tool.setuptools.packages.find]
include = ["api*", "ai_runtime*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The async engine's pool must live in ONE event loop; share a session loop across tests.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"

[tool.mypy]
ignore_missing_imports = true
mypy_path = "."
files = ["api/modules", "api/policy"]
check_untyped_defs = true
